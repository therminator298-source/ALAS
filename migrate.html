<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Migrar datos a Supabase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b1120; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .card {
      background: #1e293b; border-radius: 20px; padding: 32px; max-width: 520px; width: 100%;
      border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .log { background: #0f172a; border-radius: 12px; padding: 16px; font-size: 13px; font-family: monospace; max-height: 300px; overflow-y: auto; margin-bottom: 20px; white-space: pre-wrap; word-break: break-all; }
    .log .ok { color: #10b981; } .log .err { color: #ef4444; } .log .info { color: #60a5fa; }
    button {
      width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; font-size: 15px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .steps { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .step { display: flex; align-items: center; gap: 12px; font-size: 14px; padding: 10px 14px; border-radius: 10px; background: #0f172a; }
    .step .num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
    .step.pending .num { background: #334155; color: #64748b; }
    .step.active .num { background: #3b82f6; color: #fff; animation: pulse 1.5s infinite; }
    .step.done .num { background: #10b981; color: #fff; }
    .step.err .num { background: #ef4444; color: #fff; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Migrar a Supabase</h1>
    <p>Transfiere usuarios y tareas de Google Sheets a Supabase</p>

    <div class="steps" id="steps">
      <div class="step pending" id="s1"><span class="num">1</span><span class="text">Cargar usuarios desde Google Sheets</span></div>
      <div class="step pending" id="s2"><span class="num">2</span><span class="text">Insertar en Supabase</span></div>
      <div class="step pending" id="s3"><span class="num">3</span><span class="text">Cargar tareas desde Google Sheets</span></div>
      <div class="step pending" id="s4"><span class="num">4</span><span class="text">Insertar en Supabase</span></div>
    </div>

    <div class="log" id="log"></div>

    <button class="btn-primary" id="btnMigrate" onclick="startMigration()">Iniciar migración</button>
  </div>

  <script src="supabase-config.js"></script>
  <script src="config.js"></script>
  <script src="supabase-lib.f4d1b5b7.min.js"></script>
  <script>
    const logEl = document.getElementById('log');

    function addLog(text, type = 'info') {
      const d = document.createElement('div');
      d.className = type;
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      console.log(text);
    }

    function setStep(id, state) {
      document.getElementById(id).className = 'step ' + state;
    }

    function getConfig() {
      const cfg = window.SUPABASE_CONFIG || {};
      const appCfg = window.APP_CONFIG || {};
      return {
        supabaseUrl: cfg.url,
        supabaseKey: cfg.anonKey,
        gasUrl: appCfg.gasUrl || (appCfg.apiBase || ''),
        appKey: appCfg.gasAppKey || ''
      };
    }

    async function fetchFromGAS(resource, gasUrl, appKey) {
      const params = 'resource=' + encodeURIComponent(resource) +
                     '&_key=' + encodeURIComponent(appKey) +
                     '&_ts=' + Date.now();
      const url = gasUrl + '?' + params;
      addLog('  GET ' + resource + '...');
      const res = await fetch(url);
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch (e) { data = null; }
      if (data && data.status === 'error') throw new Error(data.message || 'Error del servidor');
      const arr = Array.isArray(data) ? data : (data && Array.isArray(data.data) ? data.data : []);
      return arr;
    }

    async function startMigration() {
      const btn = document.getElementById('btnMigrate');
      btn.disabled = true;
      btn.textContent = 'Migrando...';
      logEl.innerHTML = '';

      addLog('Iniciando migracion...');
      addLog('---');
      addLog('Verificando configuracion...');

      const config = getConfig();
      addLog('  Supabase URL: ' + (config.supabaseUrl ? 'OK' : 'FALTA'));
      addLog('  Supabase Key: ' + (config.supabaseKey ? 'OK' : 'FALTA'));
      addLog('  GAS URL: ' + (config.gasUrl ? 'OK' : 'FALTA'));
      addLog('  App Key: ' + (config.appKey ? 'OK' : 'FALTA'));

      if (!config.supabaseUrl || !config.supabaseKey || !config.gasUrl) {
        addLog('ERROR: Faltan configuraciones. Abriste este archivo desde la carpeta correcta?', 'err');
        btn.disabled = false;
        btn.textContent = 'Reintentar';
        return;
      }

      if (typeof window.__supabase__ === 'undefined' || !window.__supabase__.createClient) {
        addLog('ERROR: Supabase JS no se cargo. Verifica que supabase-lib.*.min.js exista.', 'err');
        btn.disabled = false;
        btn.textContent = 'Reintentar';
        return;
      }

      addLog('Conectando a Supabase...');
      const supabase = window.__supabase__.createClient(config.supabaseUrl, config.supabaseKey, {
        auth: { persistSession: false }
      });
      addLog('Conexion OK', 'ok');

      let users = [];
      let tasks = [];

      // Step 1
      setStep('s1', 'active');
      try {
        addLog('---');
        addLog('Paso 1: Cargando usuarios desde Google Sheets...');
        users = await fetchFromGAS('usuarios', config.gasUrl, config.appKey);
        addLog('Usuarios obtenidos: ' + users.length, users.length > 0 ? 'ok' : 'info');
        setStep('s1', 'done');
      } catch (e) {
        addLog('Error cargando usuarios: ' + e.message, 'err');
        setStep('s1', 'err');
        btn.disabled = false;
        btn.textContent = 'Reintentar';
        return;
      }

      // Step 2
      setStep('s2', 'active');
      try {
        addLog('Paso 2: Insertando usuarios en Supabase...');
        if (users.length > 0) {
          const formatted = users.map(function(u) {
            return {
              id: u.id || ('usr_' + Math.random().toString(36).slice(2,8)),
              nombre: u.nombre || u.nm || 'Sin nombre',
              rol: (u.rol || 'operativo').toLowerCase(),
              dep: u.dep || 'fabrica',
              activo: u.activo !== false
            };
          });
          const { error } = await supabase.from('usuarios').upsert(formatted, { onConflict: 'id' });
          if (error) throw error;
          addLog('  Insertados: ' + formatted.length, 'ok');
        } else {
          addLog('  No hay usuarios para migrar (salteando)', 'info');
        }
        setStep('s2', 'done');
      } catch (e) {
        addLog('Error insertando usuarios: ' + e.message, 'err');
        setStep('s2', 'err');
        btn.disabled = false;
        btn.textContent = 'Reintentar';
        return;
      }

      // Step 3
      setStep('s3', 'active');
      try {
        addLog('---');
        addLog('Paso 3: Cargando tareas desde Google Sheets...');
        tasks = await fetchFromGAS('tareas', config.gasUrl, config.appKey);
        addLog('Tareas obtenidas: ' + tasks.length, tasks.length > 0 ? 'ok' : 'info');
        setStep('s3', 'done');
      } catch (e) {
        addLog('Error cargando tareas: ' + e.message, 'err');
        setStep('s3', 'err');
        btn.disabled = false;
        btn.textContent = 'Reintentar';
        return;
      }

      // Step 4
      setStep('s4', 'active');
      try {
        addLog('Paso 4: Insertando tareas en Supabase...');
        if (tasks.length > 0) {
          const formatted = tasks.map(function(t) {
            var task = t.tarea || t;
            return {
              id: task.id || ('tsk_' + Math.random().toString(36).slice(2,12)),
              fecha: String(task.fecha || '').slice(0, 10),
              tipo: String(task.tipo || ''),
              obs: String(task.obs || ''),
              hi: String(task.hi || ''),
              hf: String(task.hf || ''),
              estado: String(task.estado || 'pendiente'),
              asig: String(task.asig || ''),
              dep: String(task.dep || 'fabrica'),
              prio: !!task.prio,
              pOrder: task.pOrder == null ? null : Number(task.pOrder),
              fCrea: String(task.fCrea || ''),
              fIni: String(task.fIni || ''),
              fFin: String(task.fFin || ''),
              creadoPor: String(task.creadoPor || ''),
              retraso: String(task.retraso || ''),
              delayCount: Number(task.delayCount) || 0,
              delayTotalMinutes: Number(task.delayTotalMinutes) || 0,
              delayActive: !!task.delayActive,
              delayCurrentId: String(task.delayCurrentId || ''),
              delayCurrentStart: String(task.delayCurrentStart || '')
            };
          });

          var batchSize = 50;
          for (var i = 0; i < formatted.length; i += batchSize) {
            var batch = formatted.slice(i, i + batchSize);
            var { error } = await supabase.from('tareas').upsert(batch, { onConflict: 'id' });
            if (error) throw error;
            addLog('  Lote ' + (Math.floor(i/batchSize) + 1) + '/' + Math.ceil(formatted.length/batchSize) + ' OK');
          }
          addLog('Total insertadas: ' + formatted.length, 'ok');
        } else {
          addLog('  No hay tareas para migrar (salteando)', 'info');
        }
        setStep('s4', 'done');
      } catch (e) {
        addLog('Error insertando tareas: ' + e.message, 'err');
        setStep('s4', 'err');
        btn.disabled = false;
        btn.textContent = 'Reintentar';
        return;
      }

      addLog('---');
      addLog('Migracion completada exitosamente', 'ok');
      btn.textContent = 'Completado';
    }
  </script>
</body>
</html>
